name: Update q2view in rachis-cli

on:
  push:
    branches: [rachis_cli_update_workflow]

permissions:
  contents: read

concurrency:
  group: update-rachis-cli-q2view
  cancel-in-progress: true

jobs:
  update-pin:
    if: github.repository == 'VinzentRisch/q2view' && github.ref == 'refs/heads/rachis_cli_update_workflow'
    uses: VinzentRisch/distributions/.github/workflows/update-rachis-cli-q2view.yaml@codex/update-rachis-cli-q2view
